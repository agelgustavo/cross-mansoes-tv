<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><title>Cross Mansões • TV</title>
<style>
:root{--accent:#ef3445;--bg:#080a0e;--fg:#f8fafc;--muted:#a2a9b7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:500 clamp(16px,1.5vw,29px)/1.35 system-ui,Arial,sans-serif}body{min-height:100vh;overflow:hidden}button{font:inherit;color:inherit;background:#171c25;border:2px solid #303743;border-radius:14px;cursor:pointer}button:focus,button.focused{outline:4px solid #facc15;outline-offset:2px;border-color:#fff}#app{height:100dvh;display:flex;flex-direction:column;padding:2.5vh 3vw;gap:2vh}header{display:flex;align-items:center;justify-content:space-between;min-height:9vh;border-bottom:2px solid #252b35;padding-bottom:1vh}.brand{font-weight:1000;letter-spacing:.07em;font-size:clamp(20px,2.4vw,45px);display:flex;align-items:center;gap:1vw}.brand svg{height:6vh;width:6vh}.brand strong{color:var(--accent)}.hint{font-size:clamp(13px,1.15vw,20px);text-align:right;color:var(--muted)}h1,h2,p{margin:0}h1{font-size:clamp(30px,3.7vw,75px);line-height:1.05}.calendar-wrap{flex:1;display:flex;flex-direction:column;min-height:0;gap:1.4vh}.months{display:flex;justify-content:center;align-items:center;gap:2vw;height:8vh}.months strong{min-width:30%;text-transform:uppercase;text-align:center;font-size:clamp(20px,2.5vw,46px)}.months button{width:7vw;height:7vh}.calendar{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:5vh repeat(6,minmax(0,1fr));gap:.65vw;min-height:0}.weekday{text-align:center;font-weight:800;font-size:clamp(12px,1.25vw,23px);color:#b5becb}.day{display:flex;flex-direction:column;text-align:left;justify-content:space-between;padding:1vh 1vw;min-height:0;font-weight:800;background:#131821;font-size:clamp(20px,2vw,39px)}.outside{opacity:.34}.today{border-color:var(--accent)}.dots{display:flex;gap:8px}.dot{width:clamp(9px,.9vw,18px);height:clamp(9px,.9vw,18px);border-radius:50%}.red{background:#ef3445}.blue{background:#329bff}.absent{font-size:clamp(10px,.85vw,15px);color:#687485;font-weight:500}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5vh;text-align:center}.choices{display:flex;gap:3vw}.choice{width:35vw;min-height:25vh;font-size:clamp(25px,3vw,55px);font-weight:900;border-width:3px}.choice.crossfit{border-color:#ef3445}.choice.hybrid{border-color:#329bff}.small{font-size:clamp(17px,1.5vw,28px);color:var(--muted)}.slide-label{display:flex;justify-content:space-between;color:var(--accent);font-weight:900;font-size:clamp(18px,2vw,40px)}.slide{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2.5vh;padding:2vh 2.5vw;background:#11151d;border:2px solid #2b323e;border-left:8px solid var(--accent);border-radius:20px}.slide h1{max-width:88%}.content{white-space:pre-wrap;overflow:hidden;max-width:88%;font-weight:650;font-size:clamp(20px,2.1vw,42px);line-height:1.26;z-index:1}.content.dense{font-size:clamp(18px,1.65vw,32px)}.content.extra{font-size:clamp(16px,1.3vw,27px)}.watermark{position:absolute;bottom:3%;right:2%;font-weight:1000;color:#ffffff08;font-size:clamp(75px,14vw,260px);pointer-events:none}.footer{display:flex;justify-content:space-between;align-items:center;gap:2vw;min-height:7vh;font-size:clamp(12px,1.1vw,22px);color:var(--muted)}.footer .nav{display:flex;gap:.6vw}.footer button{padding:.7vh 1.3vw;font-size:clamp(13px,1.2vw,23px)}@media(max-width:700px){#app{padding:2vh 2vw}.brand{letter-spacing:0}.hint{display:none}.calendar{gap:3px}.day{padding:5px;border-radius:6px}.choices{flex-direction:column}.choice{width:90vw}.slide{padding:1vh 2vw}.content{max-width:100%}.watermark{display:none}.footer{font-size:11px}}@media(max-height:650px){.calendar{grid-template-rows:4vh repeat(6,minmax(0,1fr))}.calendar-wrap{gap:.4vh}.months{height:6vh}.slide{gap:1vh}}
#tv-clock{font-size:clamp(25px,3vw,58px);font-weight:950;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right;line-height:1}#tv-clock small{display:block;color:var(--muted);font-size:clamp(11px,1vw,19px);letter-spacing:.12em}.hint{display:none}@media(max-width:700px){#tv-clock{font-size:25px}#tv-clock small{font-size:10px}}
/* Mansões TV: layout de apresentação baseado no estilo Suspicious Minds */
:root{--gold:#ffd34e}
body{background:radial-gradient(ellipse at 88% 4%,#4a080c 0,transparent 35%),radial-gradient(ellipse at 10% 100%,#220406 0,transparent 40%),#060606}
#app{gap:1.3vh;padding:1.8vh 2.5vw;background-image:repeating-linear-gradient(140deg,transparent 0,transparent 43px,#ffffff03 44px,transparent 45px)}
header{min-height:10vh;border-bottom:3px solid var(--accent);padding-bottom:1vh}
.brand{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(25px,3vw,58px);letter-spacing:.07em}
.brand svg{height:7vh;width:7vh;filter:drop-shadow(0 0 5px #ff202040)}
.brand strong{color:var(--fg)}
#tv-clock{color:#fff}
#tv-clock small{color:var(--accent);font-family:Arial,sans-serif}
.calendar-wrap{gap:1.4vh}.months strong{font-family:Impact,'Arial Narrow',sans-serif;letter-spacing:.12em}
.day{background:#111114;border:1px solid #454040;border-radius:2px;box-shadow:inset 0 0 22px #000;transition:background .1s}.day:focus,.day.focused{background:#292022}
.dot{box-shadow:0 0 12px currentColor}.dot.red{color:#ef3445}.dot.blue{color:#329bff}
.slide-label{padding:.3vh .8vw;text-transform:uppercase;font-family:Arial,sans-serif;letter-spacing:.13em;font-size:clamp(15px,1.3vw,25px);border-left:5px solid var(--accent)}
.slide-label span:last-child{color:#e2e2e2}
.slide{display:block;background:linear-gradient(115deg,#121214fb 0%,#09090afa 67%,#240609fb 100%);border:1px solid #403438;border-left:.45vw solid var(--accent);border-radius:3px;padding:2vh 3vw 1vh;position:relative;overflow:hidden}
.slide h1{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;font-size:clamp(34px,4.35vw,82px);letter-spacing:.035em;max-width:100%;white-space:normal;margin:0 0 1vh;line-height:1.05;text-shadow:2px 3px #000}
.slide h1:before{content:'MANSÕES • PERFORMANCE';display:block;color:var(--accent);font:900 clamp(12px,1.1vw,22px) Arial,sans-serif;letter-spacing:.3em;margin-bottom:1vh}
.gorilla-watermark{position:absolute;right:1.5%;bottom:-2%;width:28%;height:78%;background:url('assets/gorilla.svg') right bottom/contain no-repeat;opacity:.24;pointer-events:none;filter:drop-shadow(0 0 20px var(--accent))}
.slide:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(10deg,transparent 0 38px,#ff000006 40px 41px);pointer-events:none}
.slide-content{position:relative;z-index:1;height:calc(100% - 9vh);overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.45vh;max-width:78%}
.workout-row{display:grid;grid-template-columns:minmax(6vw,auto) 1fr;align-items:center;gap:1.3vw;padding:.7vh 0;border-top:1px solid #ffffff25;min-height:6vh}
.workout-row:first-child{border-top:none}
.workout-row .quantity{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(28px,3.3vw,64px);line-height:1;color:var(--accent);white-space:nowrap;text-align:right}
.workout-row .movement{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(23px,2.2vw,43px);line-height:1.08;text-transform:uppercase;letter-spacing:.025em}
.workout-row:not(:has(.quantity)) .movement{grid-column:1 / -1}
.workout-section{font:900 clamp(15px,1.25vw,24px) Arial,sans-serif;letter-spacing:.09em;color:var(--gold);background:#300b0c;padding:.65vh .8vw;margin:.3vh 0;text-transform:uppercase}
.workout-note{font:650 clamp(15px,1.2vw,24px) Arial,sans-serif;color:#e1dedc;padding:.45vh .5vw}
.workout-note b{color:var(--accent)}
.adaptation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1.2vw;max-width:96%;width:96%;height:100%;align-items:stretch}
.adaptation-card{border:1px solid #4a3535;border-top:4px solid var(--accent);background:#0d0b0cf2;display:flex;flex-direction:column;min-width:0}
.adaptation-card h2{background:#260609;color:var(--accent);padding:1vh 1vw;font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(19px,1.9vw,37px);text-transform:uppercase}
.adaptation-card .category{padding:.45vh 1.2vw;display:grid;grid-template-columns:4.2vw 1fr;gap:1vw;font:700 clamp(16px,1.4vw,28px) Arial,sans-serif;border-top:1px solid #ffffff18}
.adaptation-card .category strong{color:var(--accent)}
.slide-content.adapt-mode{max-width:100%;height:calc(100% - 10vh)}
.slide-content.adapt-mode .gorilla-watermark{display:none}
.footer{border-top:2px solid #343030;min-height:6vh}.footer button{border-radius:3px;background:#1c0b0d;border-color:#6b272c}
@media(max-width:800px){.slide-content{max-width:98%}.gorilla-watermark{opacity:.08}.adaptation-grid{max-width:100%;width:100%}.workout-row .movement{font-size:clamp(15px,2.3vw,32px)}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';
const app=document.getElementById('app'),T={crossfit:{label:'CROSSFIT',color:'#ef3445'},hybrid:{label:'HYBRID RUN',color:'#329bff'}},S={view:'calendar',date:'',program:'',slide:0,workout:null,month:new Date().getMonth(),year:new Date().getFullYear(),days:{}};let active=0,controls=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&apos;':'&#39;'}[c])),key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=key(new Date()),display=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{dateStyle:'full'}),data=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
function focus(i){if(!controls.length)return;active=(i+controls.length)%controls.length;controls.forEach((b,n)=>b.classList.toggle('focused',n===active));controls[active].focus({preventScroll:true})}
function header(){document.documentElement.style.setProperty('--accent',T[S.program]?.color||'#ef3445');return '<header><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="var(--accent)" d="M32 3 9 14 5 37 19 57h26l14-20-4-23L32 3ZM21 24l11-6 11 6-2 8-9 4-9-4-2-8Z"/><path fill="#080a0e" d="M16 32h12l-6 8zm20 0h12l-6 8zM23 44h18l-9 8z"/></svg>CROSS <strong>MANSÕES</strong></div><div id="tv-clock">--:--<small>HORÁRIO DE BRASÍLIA</small></div></header>'}
function foot(msg='Setas: navegar · OK: selecionar · Voltar: calendário'){return '<div class="footer"><span>'+esc(msg)+'</span><div class="nav"><button data-act="home">⌂ Calendário</button><button data-act="refresh">↻ Atualizar</button></div></div>'}
function calendar(){let f=new Date(S.year,S.month,1),start=(f.getDay()+6)%7,n=f.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),html='<div class="calendar-wrap"><div class="months"><button data-act="month" data-value="-1">◀</button><strong>'+esc(n)+'</strong><button data-act="month" data-value="1">▶</button></div><div class="calendar">'+['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>'<div class="weekday">'+x+'</div>').join('');for(let i=0;i<42;i++){let d=new Date(S.year,S.month,1-start+i),k=key(d),p=S.days[k]||[];html+='<button class="day '+(d.getMonth()!==S.month?'outside ':'')+(k===today?'today':'')+'" data-act="day" data-value="'+k+'"><span>'+d.getDate()+'</span><span class="dots">'+(p.includes('crossfit')?'<i class="dot red"></i>':'')+(p.includes('hybrid')?'<i class="dot blue"></i>':'')+'</span>'+(p.length?'':'<span class="absent">Sem treino</span>')+'</button>'}return html+'</div></div>'+foot('Vermelho: CrossFit · Azul: Hybrid Run · Setas e OK no controle remoto')}
function program(){let ps=S.days[S.date]||[];return '<main class="panel"><div class="small">'+esc(display(S.date))+'</div><h1>Escolha a modalidade</h1><div class="choices">'+ps.map(p=>'<button class="choice '+p+'" data-act="open" data-value="'+p+'">'+T[p].label+'</button>').join('')+'</div></main>'+foot()}
function pages(){let w=S.workout;if(!w)return[];let result=[];for(let [k,t] of [['warmup','AQUECIMENTO'],['skill','SKILL / STRENGTH'],['wod','WOD'],['adaptations','ADAPTAÇÕES']]){let v=w[k];if(!v)continue;let txt=Array.isArray(v)?v.join('\n'):typeof v==='string'?v:v.text||'';if(!txt.trim())continue;let chunks=txt.split(/\n\s*---PAGE---\s*\n/);for(let i=0;i<chunks.length;i++)result.push({name:t+(chunks.length>1?' '+(i+1)+'/'+chunks.length:''),text:chunks[i]})}return result}
function visualLines(t){return t.split('\n').map(raw=>raw.trim()).filter(Boolean).map(x=>{let z=esc(x);if(/^(-?\s*)?(RX\+|RX|INT|SC|INI)\s*:/i.test(x))return '<div class="workout-note">'+z+'</div>';if(/^(SCORE|TIME CAP|DURAÇÃO TOTAL|DESCANSO|REST|FOR TIME|EVERY |TABATA|TEAMS OF |OPTIONAL ACCESSORY|PREPARAÇÃO ESPECÍFICA|[0-9]+ ROUNDS|[0-9]+–[0-9]+ SETS|[0-9]+ SETS|BODY BUILDER)/i.test(x))return '<div class="workout-section">'+z+'</div>';const m=x.match(/^[-•]?\s*(\d+(?:[.,]\d+)?(?:\.\d{3})?(?:\"|')?(?:\s*m)?)\s+(.+)$/i);if(m)return '<div class="workout-row"><div class="quantity">'+esc(m[1])+'</div><div class="movement">'+esc(m[2])+'</div></div>';return '<div class="workout-note">'+z+'</div>'}).join('')}
function adapCards(t){let parts=t.split(/\n\s*\n/).map(a=>a.trim()).filter(Boolean);return '<div class="adaptation-grid">'+parts.map(block=>{let lines=block.split('\n').map(v=>v.trim()).filter(Boolean),heading=lines.shift();return '<div class="adaptation-card"><h2>'+esc(heading)+'</h2>'+lines.map(line=>{let m=line.match(/^(RX\+|RX|INT|SC|INI):\s*(.*)$/);return m?'<div class="category"><strong>'+esc(m[1])+'</strong><span>'+esc(m[2])+'</span></div>':'<div class="workout-note">'+esc(line)+'</div>'}).join('')+'</div>'}).join('')+'</div>'}
function slides(){let p=pages();if(!p.length)return '<main class="panel"><h1>Nenhum treino publicado</h1><p class="small">Calendário disponível. Os treinos serão adicionados depois.</p></main>'+foot();S.slide=Math.min(S.slide,p.length-1);let x=p[S.slide],adapt=x.name.startsWith('ADAPTAÇÕES');return '<div class="slide-label"><span>'+esc(x.name)+'</span><span>'+(S.slide+1)+' / '+p.length+'</span></div><main class="slide"><div class="gorilla-watermark" aria-hidden="true"></div><h1>'+esc(S.workout.title||T[S.program].label)+'</h1><div class="slide-content '+(adapt?'adapt-mode':'')+'">'+(adapt?adapCards(x.text):visualLines(x.text))+'</div></main><div class="footer"><span>'+esc(T[S.program].label)+' · '+esc(display(S.date))+'</span><div class="nav"><button data-act="previous">◀ Anterior</button><button data-act="next">Próxima ▶</button><button data-act="home">⌂ Calendário</button></div></div>'}
function render(){app.innerHTML=header()+(S.view==='calendar'?calendar():S.view==='program'?program():slides());tickClock();controls=[...app.querySelectorAll('[data-act]')];controls.forEach(el=>el.addEventListener('click',()=>action(el.dataset.act,el.dataset.value)));focus(Math.min(active,controls.length-1))}
async function action(a,v){if(a==='home'){S.view='calendar';S.program='';S.workout=null;active=0;render()}else if(a==='refresh'){if('serviceWorker' in navigator){try{let registration=await navigator.serviceWorker.getRegistration();if(registration)await registration.update()}catch(e){console.warn(e)}}location.reload();return}else if(a==='month'){let d=new Date(S.year,S.month+Number(v),1);S.year=d.getFullYear();S.month=d.getMonth();active=0;render()}else if(a==='day'){S.date=v;let p=S.days[v]||[];active=0;if(p.length===1)await open(p[0]);else if(p.length){S.view='program';render()}else{S.program='';S.workout=null;S.view='slide';render()}}else if(a==='open')await open(v);else if(a==='next'||a==='previous'){S.slide=Math.max(0,Math.min(pages().length-1,S.slide+(a==='next'?1:-1)));active=0;render()}}
async function open(p){S.program=p;S.view='slide';S.slide=0;S.workout=null;active=0;try{let obj=await data('data/'+S.date+'.json');S.workout=obj.programs?.[p]||null}catch(e){console.warn('Treino indisponível',e)}render()}
async function load(){try{let obj=await data('data/index.json'),n={};for(let [d,ps] of Object.entries(obj.days||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(ps))n[d]=ps.filter(p=>p in T);S.days=n;localStorage.setItem('mansoes-days',JSON.stringify(n))}catch(e){try{S.days=JSON.parse(localStorage.getItem('mansoes-days')||'{}')}catch{S.days={}}}}
document.addEventListener('keydown',e=>{let k=e.key;if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Enter','Escape','Backspace','BrowserBack'].includes(k))e.preventDefault();if(['Escape','Backspace','BrowserBack'].includes(k)){action('home');return}if(S.view==='slide'&&['ArrowRight','ArrowLeft'].includes(k)){action(k==='ArrowRight'?'next':'previous');return}if(S.view==='calendar'&&k.startsWith('Arrow')){let c=controls[active],n=({ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7})[k];if(c?.dataset.act==='day'){let days=controls.filter(x=>x.dataset.act==='day'),i=days.indexOf(c),next=days[i+n];if(next)focus(controls.indexOf(next));else focus(active+Math.sign(n))}else focus(active+Math.sign(n));return}if(k==='ArrowRight'||k==='ArrowDown')focus(active+1);if(k==='ArrowLeft'||k==='ArrowUp')focus(active-1);if(k==='Enter')controls[active]?.click()});
window.addEventListener('online',load);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(console.warn));load().then(render);
})();
</script></body></html>
