name: Testes e Deploy Cross Mansões TV
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências
        run: npm install --no-audit --no-fund
      - name: Navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes unitários
        run: npm test
      - name: Testes funcionais e responsividade
        run: npm run test:e2e
      - name: Evidências de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
  content-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir conversor isolado
        run: docker build -t mansoes-converter scripts/content
      - name: Validar formatos, páginas, dados e isolamento
        run: >-
          docker run --rm --network none --memory 1536m --cpus 2
          --pids-limit 512 --read-only --cap-drop ALL
          --security-opt no-new-privileges --tmpfs /tmp:rw,size=512m
          -v "$PWD/scripts/content/test_converter.py:/app/test_converter.py:ro"
          --entrypoint python mansoes-converter /app/test_converter.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, content-test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
