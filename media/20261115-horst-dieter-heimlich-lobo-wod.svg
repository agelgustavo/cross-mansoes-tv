e-width="3"/><text x="841" y="270" fill="#fff" font-size="39" font-weight="900" >BLOCO 2</text><text x="841" y="340" fill="#fff" font-size="28" font-weight="700" >• 400 m Weighted Walking Lunges | PSE 6-7</text><text x="841" y="389" fill="#fff" font-size="28" font-weight="700" >• 800 m Row</text><rect x="45" y="440" width="742" height="188" rx="13" fill="#0b141e" stroke="#00abff" stroke-width="3"/><rect x="45" y="440" width="742" height="57" rx="13" fill="#057abe" stroke="#09b8fa" stroke-width="3"/><text x="71" y="480" fill="#fff" font-size="39" font-weight="900" >BLOCO 3</text><text x="71" y="550" fill="#fff" font-size="28" font-weight="700" >• 300 m Burpee Broad Jump</text><text x="71" y="599" fill="#fff" font-size="28" font-weight="700" >• 1.600 m Run | Sync 3</text><rect x="815" y="440" width="742" height="188" rx="13" fill="#0b141e" stroke="#00abff" stroke-width="3"/><rect x="815" y="440" width="742" height="57" rx="13" fill="#057abe" stroke="#09b8fa" stroke-width="3"/><text x="841" y="480" fill="#fff" font-size="39" font-weight="900" >BLOCO 4</text><text x="841" y="550" fill="#fff" font-size="28" font-weight="700" >• 200 Sit-Ups | Sync 4</text><rect x="45" y="664" width="1507" height="172" rx="13" fill="#04111d" stroke="#009eee" stroke-width="3"/><text x="70" y="710" fill="#26c0ff" font-size="35" font-weight="900" >REGRAS</text><text x="72" y="751" fill="#fff" font-size="25" font-weight="500" >Repetições e distâncias totais da equipe. Bloco 3: 1 faz Burpee Broad Jump</text><text x="72" y="787" fill="#fff" font-size="24" font-weight="500" >enquanto 3 correm juntos em trechos de 200 m; depois, 1 trabalha por vez nos burpees.</text><text x="72" y="821" fill="#fff" font-size="24" font-weight="500" >Sync 4: quatro atletas fazem Sit-Ups sincronizados.</text><rect x="1040" y="840" width="513" height="48" rx="13" fill="#049fe8" stroke="#39d7ff" stroke-width="3"/><text x="1294" y="875" fill="#06151f" font-size="25" font-weight="900" text-anchor="middle">CAP 46'  |  SCORE POR BLOCO</text></g></svg>